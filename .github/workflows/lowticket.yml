name: Low Ticket (1 post por dia - PAUSADO por padrao)

# CORRIGIDO pos-suspensao #4851740
# Problemas do original:
# - 2 posts/dia (09:00 valor + 19:00 oferta R$7) = 2x mais chance de bloqueio no Instagram/Meta
# - O post da tarde era OFERTA direta, que o Meta marca como spam / promocional
# - 3 tentativas por execucao x 2 execucoes = ate 6 tentativas de post por dia
# Correcao:
# - So 1 cron: 09:00 Brasilia, post de VALOR (manha). Post de oferta removido.
# - Nao faz commit, so gera artifact. Nao alimenta Pages.
# - Para religar, mude LT_PAUSADO para false em Variables. Por padrao fica pausado
#   ate o GitHub voltar a confiar (2-3 semanas apos o desbloqueio).

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Brasilia -> UNICO post do dia, post de valor
  workflow_dispatch:
    inputs:
      slot:
        description: "manha (unico slot permitido)"
        default: "manha"

concurrency:
  group: lowticket
  cancel-in-progress: false

jobs:
  lowticket:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      GH_PAT_VARIABLES: ${{ secrets.GH_PAT_VARIABLES }}
      FABRICA_HASHTAGS_INSTAGRAM: ${{ vars.FABRICA_HASHTAGS_INSTAGRAM || secrets.FABRICA_HASHTAGS_INSTAGRAM || '20' }}
      FABRICA_HASHTAGS_FACEBOOK: ${{ vars.FABRICA_HASHTAGS_FACEBOOK || secrets.FABRICA_HASHTAGS_FACEBOOK || '20' }}
      LT_DRY_RUN: ${{ vars.LT_DRY_RUN || secrets.LT_DRY_RUN || 'true' }}
      LT_PAUSADO: ${{ vars.LT_PAUSADO || 'true' }}  # true = nao posta, so simula. Mude para false para religar.
      LT_IG_USER_ID: ${{ secrets.LT_IG_USER_ID }}
      LT_IG_ACCESS_TOKEN: ${{ secrets.LT_IG_ACCESS_TOKEN }}
      LT_TIKTOK_ACCESS_TOKEN: ${{ secrets.LT_TIKTOK_ACCESS_TOKEN }}
      LT_PUBLIC_IMAGE_BASE_URL: ${{ vars.LT_PUBLIC_IMAGE_BASE_URL }}
      LT_OFFER_LINK: ${{ vars.LT_OFFER_LINK }}
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
    steps:
      - name: Checa pausa
        run: |
          if [ "$LT_PAUSADO" = "true" ]; then echo "Low Ticket pausado por seguranca pos-suspensao. Para religar, LT_PAUSADO=false"; exit 0; fi
      - uses: actions/checkout@v4
        if: env.LT_PAUSADO != 'true'
      - uses: actions/setup-python@v5
        if: env.LT_PAUSADO != 'true'
        with: { python-version: "3.11" }
      - run: pip install -r infoprodutos_lowticket/requirements_lowticket.txt
        if: env.LT_PAUSADO != 'true'
      - name: Define o slot (sempre manha)
        if: env.LT_PAUSADO != 'true'
        run: echo "SLOT=manha" >> $GITHUB_ENV
      - name: Executa o robo (1 tentativa principal, sem loop de 3x)
        if: env.LT_PAUSADO != 'true'
        run: |
          export POST_MARKER_DIR="$RUNNER_TEMP/marcas"; rm -rf "$POST_MARKER_DIR"; mkdir -p "$POST_MARKER_DIR"
          export POST_REDES="facebook,instagram"
          python -m infoprodutos_lowticket.run_lowticket --slot $SLOT
      - name: Guarda a imagem gerada (baixe na pagina da execucao)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-manha
          path: output_lowticket/
          if-no-files-found: ignore
          retention-days: 7
