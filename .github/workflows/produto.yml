name: Fabrica de Produtos - Unificado (1 commit por dia)

# UNIFICADO - substitui produto.yml
# Regras pos-suspensao GitHub (ticket #4851740):
# - 1 execucao por dia, 1 commit por dia
# - Sem GitHub Pages (sem pages-build-deployment)
# - Sem index.html de loja, sem preco, sem botao Comprar no repo
# - Vendas SOMENTE na Cakto / Kiwify / Hotmart (externo)
# - main.yml (postar no Facebook/Instagram) fica PAUSADO por enquanto

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "criar | verificar | status"
        default: "criar"
      produto_id:
        description: "So para definir-link"
        required: false
      link_compra:
        description: "So para definir-link: link copiado da plataforma"
        required: false
  schedule:
    - cron: "0 9 * * *"  # UNICO gatilho: 06:00 Brasilia

permissions:
  contents: write

concurrency:
  group: fabrica-produtos-unificado
  cancel-in-progress: false

jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      GH_PAT_VARIABLES: ${{ secrets.GH_PAT_VARIABLES }}
      FABRICA_HASHTAGS_INSTAGRAM: ${{ vars.FABRICA_HASHTAGS_INSTAGRAM || secrets.FABRICA_HASHTAGS_INSTAGRAM || '20' }}
      FABRICA_HASHTAGS_FACEBOOK: ${{ vars.FABRICA_HASHTAGS_FACEBOOK || secrets.FABRICA_HASHTAGS_FACEBOOK || '20' }}
      CAKTO_CLIENT_ID: ${{ secrets.CAKTO_CLIENT_ID }}
      CAKTO_CLIENT_SECRET: ${{ secrets.CAKTO_CLIENT_SECRET }}
      CAKTO_SALES_PAGE: ${{ vars.CAKTO_SALES_PAGE }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
      GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      FABRICA_DRY_RUN: ${{ vars.FABRICA_DRY_RUN || secrets.FABRICA_DRY_RUN || 'true' }}
      FABRICA_PAUSADA: ${{ vars.FABRICA_PAUSADA || secrets.FABRICA_PAUSADA || 'false' }}
      FABRICA_MAX_POR_DIA: '1'  # TRAVADO EM 1 por dia ate o GitHub voltar a confiar
      PRODUTO_TOPICO: ${{ secrets.PRODUTO_TOPICO }}
      EVENTO: ${{ github.event_name }}
      ACAO_INPUT: ${{ github.event.inputs.acao }}
      PRODUTO_ID: ${{ github.event.inputs.produto_id }}
      LINK_COMPRA: ${{ github.event.inputs.link_compra }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fabrica_produtos/requirements_fabrica.txt
      - run: pip install -r fabrica_produtos/requirements_fabrica.txt

      - name: Executa a fabrica (1 lote por dia)
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then ACAO="${ACAO_INPUT:-criar}"; else ACAO=criar; LOTE="--lote"; fi
          echo "Acao: $ACAO"
          if [ "$ACAO" = "definir-link" ]; then
            if [ -z "$PRODUTO_ID" ] || [ -z "$LINK_COMPRA" ]; then echo "definir-link exige produto_id e link_compra"; exit 1; fi
            python -m fabrica_produtos definir-link --id "$PRODUTO_ID" --link "$LINK_COMPRA"
          else
            python -m fabrica_produtos "$ACAO" ${LOTE:-}
          fi

      # REMOVIDO: passo "Atualiza a pagina link-na-bio (hub)"
      # Motivo: ele gerava index.html e alimentava o GitHub Pages, que causou a suspensao.
      # O link-na-bio agora fica so na bio do Instagram/TikTok, apontando para Cakto.

      - name: Roteiros de Reels dos produtos novos
        if: always()
        continue-on-error: true
        run: python -m fabrica_produtos reels

      - name: Capas na Cakto
        if: always()
        continue-on-error: true
        run: python -m fabrica_produtos capas

      - name: Capas para upload manual na Cakto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capas-cakto
          path: docs/capas/*.png
          if-no-files-found: ignore

      - name: UNICO commit do dia - Guarda o catalogo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # So catalogo + capas. NUNCA index.html de loja, nunca Pages.
          git add catalogo docs
          # Trava de seguranca: se por acidente existir index.html de loja, nao commita
          if git diff --cached --name-only | grep -q "index.html"; then echo "::error::index.html de loja detectado, abortando commit"; exit 1; fi
          if git diff --cached --quiet; then echo "Catalogo sem mudancas"; exit 0; fi
          git commit -m "Atualiza catalogo (1x/dia)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Pacotes de cadastro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-de-produto
          path: catalogo/pacotes/
          if-no-files-found: ignore
          retention-days: 14

  cakto-browser:
    needs: fabrica
    if: always() && needs.fabrica.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAKTO_EMAIL: ${{ secrets.CAKTO_EMAIL }}
      CAKTO_PASSWORD: ${{ secrets.CAKTO_PASSWORD }}
      CAKTO_CLIENT_ID: ${{ secrets.CAKTO_CLIENT_ID }}
      CAKTO_CLIENT_SECRET: ${{ secrets.CAKTO_CLIENT_SECRET }}
      CAKTO_EXIGE_IMAGEM: ${{ vars.CAKTO_EXIGE_IMAGEM || 'false' }}
    steps:
      - name: Sem CAKTO_EMAIL o job nao faz nada
        if: env.CAKTO_EMAIL == ''
        run: echo "CAKTO_EMAIL nao definido; upload pelo navegador desativado."
      - uses: actions/checkout@v4
        if: env.CAKTO_EMAIL != ''
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        if: env.CAKTO_EMAIL != ''
        with:
          python-version: "3.11"
      - name: Instala dependencias e o Chromium
        if: env.CAKTO_EMAIL != ''
        run: |
          pip install requests pillow playwright
          playwright install --with-deps chromium
      - name: Sobe as capas pelo painel da Cakto
        if: env.CAKTO_EMAIL != ''
        continue-on-error: true
        run: python -m fabrica_produtos.cakto_browser
      - name: Screenshots de depuracao
        if: always() && env.CAKTO_EMAIL != ''
        uses: actions/upload-artifact@v4
        with:
          name: cakto-browser-debug
          path: cakto-browser-debug/
          if-no-files-found: ignore
          retention-days: 7
