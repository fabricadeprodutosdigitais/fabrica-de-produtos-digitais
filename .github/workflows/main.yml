name: Executar Fabrica de Infoprodutos - Corrigido (1 post por dia)

# CORRIGIDO pos-suspensao #4851740
# Problemas do original:
# - 3 tentativas com troca de provedor = ate 3 execucoes do main.py por dia
# - Sem trava de pausa, sem concurrency
# - Postava em Facebook + Instagram no mesmo job que o reels.yml tambem posta
#   = risco de post duplicado no mesmo dia
# Correcao:
# - 1 cron, 1 tentativa, sem loop de retry
# - Pausado por padrao (MAIN_PAUSADO=true). Para religar: MAIN_PAUSADO=false em Variables
# - Sem commit, sem Pages, sem index.html
# - DEIXE DESATIVADO por 2-3 semanas apos o desbloqueio. Reels.yml ja faz 1 Reel/dia.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # 1x/dia, 14:00 Brasilia

permissions:
  contents: read

concurrency:
  group: main-fabrica
  cancel-in-progress: false

jobs:
  run-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_PAUSADO: ${{ vars.MAIN_PAUSADO || 'true' }}  # true = nao posta, so simula. Mude para false para religar.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      GH_PAT_VARIABLES: ${{ secrets.GH_PAT_VARIABLES }}
      FABRICA_HASHTAGS_INSTAGRAM: ${{ vars.FABRICA_HASHTAGS_INSTAGRAM || secrets.FABRICA_HASHTAGS_INSTAGRAM || '20' }}
      FABRICA_HASHTAGS_FACEBOOK: ${{ vars.FABRICA_HASHTAGS_FACEBOOK || secrets.FABRICA_HASHTAGS_FACEBOOK || '20' }}
      MODEL: ${{ secrets.MODEL }}
      PRODUTO_TOPICO: ${{ secrets.PRODUTO_TOPICO }}
      IMAGEM_PADRAO_URL: ${{ secrets.IMAGEM_PADRAO_URL }}
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      BUSINESS_PORTFOLIO_ID: ${{ secrets.BUSINESS_PORTFOLIO_ID }}
      DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}  # true = simula, nao publica. Para publicar: DRY_RUN=false
    steps:
      - name: Checa pausa
        run: |
          if [ "$MAIN_PAUSADO" = "true" ]; then echo "main.yml pausado por seguranca pos-suspensao. Para religar: MAIN_PAUSADO=false"; exit 0; fi
      - name: Checkout do Repositorio
        if: env.MAIN_PAUSADO != 'true'
        uses: actions/checkout@v4
      - name: Configurar Python
        if: env.MAIN_PAUSADO != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar Dependencias
        if: env.MAIN_PAUSADO != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escolhe o provedor de IA (1 tentativa de teste)
        if: env.MAIN_PAUSADO != 'true'
        run: |
          PRIM="${GEMINI_MODEL:-gemini/gemini-3.7-flash}"; PRIM="${PRIM#gemini/}"
          ESCOLHIDO=""
          for M in "$PRIM" gemini-3.8-flash; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":5}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" || true)
            echo "Modelo $M respondeu HTTP $CODE"
            if [ "$CODE" = "200" ]; then ESCOLHIDO="$M"; break; fi
          done
          PROV=""
          if [ -n "$ESCOLHIDO" ]; then PROV=gemini
          else
            if [ -n "$GROQ_API_KEY" ]; then
              GCODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 https://api.groq.com/openai/v1/chat/completions \
                -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
                -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"ok"}],"max_tokens":16}' || true)
              echo "Groq respondeu HTTP $GCODE"
              if [ "$GCODE" = "200" ]; then PROV=groq; fi
            fi
            if [ -z "$PROV" ] && [ -n "$OPENROUTER_API_KEY" ]; then PROV=openrouter; fi
            if [ -z "$PROV" ]; then PROV=gemini; fi
            ESCOLHIDO="$PRIM"
          fi
          echo "Provedor escolhido: $PROV"
          echo "PROVEDOR_ESCOLHIDO=$PROV" >> $GITHUB_ENV
          echo "GEMINI_ESCOLHIDO=gemini/$ESCOLHIDO" >> $GITHUB_ENV

      - name: Executar Pipeline Principal (1 tentativa apenas)
        if: env.MAIN_PAUSADO != 'true'
        env:
          LLM_PROVIDER: ${{ env.PROVEDOR_ESCOLHIDO || secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_MODEL: ${{ env.GEMINI_ESCOLHIDO || secrets.GEMINI_MODEL }}
        run: |
          export POST_MARKER_DIR="$RUNNER_TEMP/marcas"; rm -rf "$POST_MARKER_DIR"; mkdir -p "$POST_MARKER_DIR"
          export POST_REDES="facebook,instagram"
          # 1 tentativa apenas - sem loop de 3x. Se falhar, tenta de novo amanha, nao na mesma hora.
          python main.py
