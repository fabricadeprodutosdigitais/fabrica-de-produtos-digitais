name: Reels (1x por dia, sem commit)

# CORRIGIDO pos-suspensao #4851740
# - Mantido 1x/dia (15:00 Brasilia)
# - REMOVIDO o commit "Guarda o registro de Reels publicados"
#   Motivo: produto.yml ja faz o UNICO commit do dia. Se o reels tambem commitar,
#   vira 2 commits/dia + conflito de rebase com o produto.yml.
# - Agora o registro fica so como Artifact, nao faz push.

on:
  schedule:
    - cron: "0 18 * * *"   # 15:00 Brasilia, 1x por dia
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = so mostra produto e legendas (nao gera video, nao publica). false = publica de verdade"
        default: "true"
      only:
        description: "Opcional: id de um produto (ex.: p20261005-1)"
        required: false

permissions:
  contents: read

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REELS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || vars.REELS_DRY_RUN || 'false' }}
      REELS_ONLY: ${{ github.event.inputs.only }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      GH_PAT_VARIABLES: ${{ secrets.GH_PAT_VARIABLES }}
      FABRICA_HASHTAGS_INSTAGRAM: ${{ vars.FABRICA_HASHTAGS_INSTAGRAM || secrets.FABRICA_HASHTAGS_INSTAGRAM || '20' }}
      FABRICA_HASHTAGS_FACEBOOK: ${{ vars.FABRICA_HASHTAGS_FACEBOOK || secrets.FABRICA_HASHTAGS_FACEBOOK || '20' }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      LINK_BIO_INSTAGRAM: ${{ vars.LINK_BIO_INSTAGRAM || secrets.LINK_BIO_INSTAGRAM }}
      LINK_FACEBOOK: ${{ vars.LINK_FACEBOOK || secrets.LINK_FACEBOOK }}
      REELS_LINK: ${{ vars.REELS_LINK }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala ffmpeg, fonte e bibliotecas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install requests pillow numpy
      - name: Musicas livres (opcional)
        run: python scripts/fetch_music.py || echo "usando mp3 de assets/music/"

      - name: Roteiro do produto novo
        continue-on-error: true
        run: |
          pip install -q -r fabrica_produtos/requirements_fabrica.txt
          python -m fabrica_produtos reels

      - name: Gera e publica 1 Reel (Facebook + Instagram, retry 3x por rede)
        run: |
          ARGS=""
          if [ -n "$REELS_ONLY" ]; then ARGS="--so $REELS_ONLY"; fi
          python -m fabrica_produtos.reels_publicar $ARGS | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # SEM COMMIT - o unico commit do dia e feito pelo produto.yml
      - name: Video e legendas (baixe na pagina da execucao)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: reels/*.mp4
          if-no-files-found: ignore
          retention-days: 7
